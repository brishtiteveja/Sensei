<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Sensei — a multilingual Socratic tutor that runs entirely on local hardware."
    />
    <!-- No CDN fonts, scripts, images or analytics. Everything is bundled. -->
    <!-- The owl from the phone app, simplified to read at 16px. Inline so the
         tab icon costs no request. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='96' fill='%234F46E5'/%3E%3Cpath d='M55 85 Q55 155 100 165 Q145 155 145 85 Q145 55 100 45 Q55 55 55 85 Z' fill='%23F5F0EB'/%3E%3Cpolygon points='65,58 74,36 83,58' fill='%23F5F0EB'/%3E%3Cpolygon points='117,58 126,36 135,58' fill='%23F5F0EB'/%3E%3Ccircle cx='80' cy='84' r='21' fill='%234F46E5'/%3E%3Ccircle cx='120' cy='84' r='21' fill='%234F46E5'/%3E%3Ccircle cx='80' cy='84' r='10' fill='%2306B6D4'/%3E%3Ccircle cx='120' cy='84' r='10' fill='%2306B6D4'/%3E%3Cpolygon points='100,102 91,116 109,116' fill='%23F4C542'/%3E%3C/svg%3E" />
    <title>Sensei</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('sensei.theme');
          var dark =
            t === 'dark' ||
            (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage blocked — default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
